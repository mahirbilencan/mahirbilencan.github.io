    Research:
      - bullet: "My research investigates algebraic structures and their geometric manifestations, with emphasis on representation theory, algebraic geometry, and coding theory."
      - bullet: "**Algebraic groups and monoids:** structure, classification, compactifications, and invariant theory."
      - bullet: "**Representation theory:** unitary representations, harmonic analysis, and categorical methods."
      - bullet: "**Algebraic geometry:** birational techniques and singularities tied to representation-theoretic questions."
      - bullet: "**Coding theory and security:** algebraic and geometric constructions for reliable communication."
      - bullet: "A growing part of this work connects mathematical structure with computational and communication problems, including quantum technologies, error-correcting codes, and secure information processing. See the [complete publication list](/publications/) for research output and references."

